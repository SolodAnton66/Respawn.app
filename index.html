<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кіберспортивний кінотеатр і трекер ігрових сесій — Візитка проєкту</title>
  <meta name="description" content="Річний учнівський проєкт учня 10 класу: кіберспортивний кінотеатр та трекер ігрових сесій у форматі гри, бота, сайту та застосунку.">
  <style>
    :root {
      --bg: #0A0406;
      --fg: #FF2E4C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Повноекранне інтерактивне полотно космосу */
    #spaceCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Основний контейнер */
    main {
      max-width: 920px;
      width: 100%;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.7s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 46, 76, 0.4);
      padding-bottom: 1.75rem;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--fg);
      padding: 0.3rem 0.8rem;
      background-color: rgba(10, 4, 6, 0.85);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .session-tracker {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      border: 1px solid var(--fg);
      padding: 0.3rem 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(10, 4, 6, 0.85);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--fg);
      animation: blink 1.4s infinite;
    }

      font-family: inherit;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
