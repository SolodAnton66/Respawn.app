<html lang="uk">
<head>

  <style>
    :root {
      --bg: #070709;
      --fg: #F5F5F7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Космічний фон із об'єктами */
    .cosmos {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Єдина гравітаційна система: Чорна діра в центрі + Сонце і Земля на орбітах навколо неї */
    .gravity-system {
      position: absolute;
      top: 50%;
      right: -140px;
      width: 680px;
      height: 680px;
      margin-top: -340px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease-out;
    }

    /* Чорна діра (центр тяжіння) */
    .black-hole {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 245, 247, 0.28);
      background: radial-gradient(circle, var(--bg) 36%, rgba(245, 245, 247, 0.14) 52%, transparent 72%);
      animation: orbitSpin 24s linear infinite, bhPulse 6s ease-in-out infinite;
      z-index: 3;
    }

    .black-hole::before,
    .black-hole::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

      inset: 14%;
      border: 1px dashed rgba(245, 245, 247, 0.35);
      animation: orbitSpin 12s linear infinite reverse;
    }
