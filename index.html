<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кіберспортивний кінотеатр і трекер ігрових сесій — Візитка проєкту</title>
  <meta name="description" content="Річний учнівський проєкт учня 10 класу: кіберспортивний кінотеатр та трекер ігрових сесій у форматі гри, бота, сайту та застосунку.">
  <style>
    :root {
      --bg: #070204;
      --fg: #FF1E38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Повноекранний SVG-космос (надійно працює в усіх браузерах) */
    .cosmos-svg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .spin-cw {
      transform-origin: center;
      animation: rotateCW 30s linear infinite;
    }

    .spin-ccw {
      transform-origin: center;
      animation: rotateCCW 45s linear infinite;
    }

    .spin-fast {
      transform-origin: center;
      animation: rotateCW 12s linear infinite;
    }

    .pulse-core {
      transform-origin: center;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    body.fast-orbit .spin-cw { animation-duration: 9s; }
    body.fast-orbit .spin-ccw { animation-duration: 14s; }
    body.fast-orbit .spin-fast { animation-duration: 4s; }

    @keyframes rotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* Основний контейнер */
    main {
      max-width: 960px;
      width: 100%;
      position: relative;
      z-index: 1;
      border: 2px solid var(--fg);
      background-color: rgba(7, 2, 4, 0.86);
      padding: 2rem;
    }
